# ============================================================================
# CHEMOTAXIS REGIME ("one to rule them all"): purely repulsive Morse + alignment-
# gated adhesion springs + TEMPORAL (chemotactic) sensing for direction.
#
# Directional drive is now per-cell and direction-based (not position-based):
# compute_state_changes! multiplies the run->tumble rate by exp(-beta * heading.grad),
# so up-gradient runs are extended and down-gradient runs cut short -> every cell
# (interior ones too) drifts along the gradient, so a COHESIVE cluster can translate
# as a unit. grad = (chemotaxis_dir_x, chemotaxis_dir_y), here (1,0) = rightward.
#
# The OLD position-sigmoid steering is disabled (rates set to "constant") and kept
# as a commented block at the bottom of this file and at the bottom of cell_model.jl.
#
# scan_metrics.jl overrides num_cells/domain_*/init_*/margin_*/total_time per scenario.
# ============================================================================

# --- Domain (default = long tight tunnel) ---
domain_width = 1600
domain_height = 50

# --- Simulation ---
num_cells = 300
dt = 0.05
total_time = 200

# --- Init region (slab seeded at the LEFT, room to migrate right) ---
init_width = 600
init_height = 50
margin_width = 0
margin_height = 0

# --- Diffusion. D_angle is raised: tumbles must REORIENT enough that cells sample
#     up-gradient headings for chemotaxis to bias them; too low and headings freeze. ---
D_angle = 0.3
D_position = 0.02

# --- Polarity restoring torque (tumbling cells only). LOW so contacts don't scatter
#     the group. ---
theta_alignment = 1.0

# --- Run/tumble rates: CONSTANT base (no position steering); chemotaxis does the
#     steering. min = the constant rate used; max/allure kept only so the file loads
#     and so "sigmoid" can be re-enabled. run fraction ~ t->r/(t->r+r->t) ~ 0.67. ---
run_to_tumble_rate_min = 0.5
run_to_tumble_rate_max = 0.6
run_to_tumble_rate_function = "constant"
run_to_tumble_rate_allure = 0.01
tumble_to_run_rate_min = 1.0
tumble_to_run_rate_max = 1.5
tumble_to_run_rate_function = "constant"
tumble_to_run_rate_allure = 0.01

# --- TEMPORAL / CHEMOTACTIC sensing. beta=0 disables (pure run/tumble). grad dir
#     (1,0) = rightward. Bigger beta = stronger directional bias. ---
chemotaxis_strength = 1.0
chemotaxis_dir_x = 1.0
chemotaxis_dir_y = 0.0

# --- Cell geometry ---
cell_hard_radius = 5
cell_soft_radius = 8

# --- Internal cohesion spring (top <-> bottom of same cell) ---
maximal_stretch = 30
top_internal_pull_strength = 1.5
bottom_internal_pull_strength = 1.5
internal_cohesion_strength = 1   # legacy, unused

# --- Run speed. 15 balances drift vs cohesion (higher disperses small groups). ---
run_speed_min = 15
run_speed_max = 15
run_speed_distribution = "constant"

# --- Walls ---
soft_boundary_potential_strength = 1.5
hard_boundary_velocity_behaviour = "bounce"

# --- TOP Morse = REPULSION ONLY (v0 = 0). r_well = hard+soft = 13. ---
top_morse_u0 = 10
top_morse_v0 = 0
top_morse_xi1 = 3
top_morse_xi2 = 6
top_morse_cutoff = 16

# --- BOTTOM Morse = REPULSION ONLY (v0 = 0). r_well = 2*soft = 16. ---
bottom_morse_u0 = 10
bottom_morse_v0 = 0
bottom_morse_xi1 = 2
bottom_morse_xi2 = 20
bottom_morse_cutoff = 16

# --- CIL ---
cil_intensity = 0.005
cil_wall_intensity = 0.05

# --- ADHESION springs (alignment-gated, top surface). range = 2*adhesion_radius.
#     2.5 holds the big sheet cohesive while chemotaxis drives it right; >=4 over-
#     compacts the tops (no rest length) and can blow up the soft Morse. ---
adhesion_strength = 1
adhesion_radius = 16

# ============================================================================
# PREVIOUS SIGMOID (position-based) STEERING — kept for reference per request.
# To use it instead of chemotaxis: set chemotaxis_strength = 0 and replace the
# rate block above with the values below (function = "sigmoid").
#
#   run_to_tumble_rate_min = 0.05
#   run_to_tumble_rate_max = 2.0
#   run_to_tumble_rate_function = "sigmoid"
#   run_to_tumble_rate_allure = -0.001
#   tumble_to_run_rate_min = 0.1
#   tumble_to_run_rate_max = 1.5
#   tumble_to_run_rate_function = "sigmoid"
#   tumble_to_run_rate_allure = -0.001
#
# (Negative allure = "run on the left, tumble/accumulate on the right" -> cohesive
# but slow, left-wall-pinned spreading. Positive allure = fast dispersed invasion.
# Neither moved a cohesive bulk as a unit; that is what the chemotaxis term adds.)
# ============================================================================
